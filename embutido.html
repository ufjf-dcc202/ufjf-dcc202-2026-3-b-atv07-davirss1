<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202</title>
    <style>
        dt{
            color: #fff;
            background-color: blue;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-weight: 700;
        }
        h1{
            color: blue;
            font-size: 46px;
            font-weight: 100;
        }
        .subtitle{
            color: #fff;
            background-color: blue;
            font-family: 'Courier New', Courier, monospace;
            font-size: 26px;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <main>
        <h1>DCC202</h1>
        <p class="subtitle">Usando elemento style no head</p>

        <dl>
            <div>
                <dt>
                    <code>color</code>
                </dt>
                <dd>
                    Cor do texto do elemento.
                </dd>
            </div>
            <div>
                <dt>
                    <code>background-color</code>
                </dt>
                <dd>
                    Cor do fundo do elemento.
                </dd>
            </div>
        </dl>
    </main>
</body>

</html>
