<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <main>
        <h1>DCC202</h1>
        <p>Você pode adicionar estilo <em>em linha</em> usando o atributo <code>style</code></p>

        <dl>
            <div>
                <dt>
                    <code>color</code>
                </dt>
                <dd style="color: blue;">
                    Cor do texto do elemento.
                </dd>
            </div>
            <div>
                <dt>
                    <code>background-color</code>
                </dt>
                <dd style="background-color: blue; color: #fff; font-family: 'Courier New', Courier, monospace; font-size: 26px; font-weight: 700;">
                    Cor do fundo do elemento.s
                </dd>
            </div>
        </dl>
    </main>
</body>

</html>
